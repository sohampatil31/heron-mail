[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heron-mail"
version = "0.0.1"
description = "Self-hosted phishing detection for your inbox."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/heron"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear,
# UP: modern syntax, S: security checks (bandit rules)
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # plain asserts are fine in tests
